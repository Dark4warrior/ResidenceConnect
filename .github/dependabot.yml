# Mise à jour automatisée des dépendances.
# Dependabot ouvre chaque semaine des pull requests pour les dépendances npm du
# monorepo et pour les actions GitHub, que la CI valide avant fusion manuelle.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Regroupe les mises à jour mineures/correctives en une seule PR.
      mineures:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
